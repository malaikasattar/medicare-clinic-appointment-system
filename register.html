<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — MediCare</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo">MediCare</div>
  <nav id="navLinks"></nav>
</header>
<div class="container">
  <form onsubmit="register(event)">
    <h2>Patient Register</h2>
    <label>Full Name</label>
    <input type="text" id="name" placeholder="Enter your full name" required>
    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email" required>
    <label>Password</label>
    <input type="password" id="password" placeholder="Choose a password" required>
    <label>Phone</label>
    <input type="tel" id="phone" placeholder="03xxxxxxxxx" maxlength="11" oninput="this.value=this.value.replace(/\D/g,'')">
    <button class="btn" type="submit">Create Account</button>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </form>
</div>
<footer>MediCare — Clinic Appointment System</footer>
<script src="js/app.js"></script>
</body>
</html>
